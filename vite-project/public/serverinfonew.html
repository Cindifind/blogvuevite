<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>服务器状态中心 · muqingxi.com</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1220'/%3E%3Cpath d='M30 68 L42 32 L58 58 L70 38' stroke='%2322d3ee' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070b14;
            --panel: rgba(148, 163, 184, 0.055);
            --panel-2: rgba(148, 163, 184, 0.09);
            --border: rgba(148, 163, 184, 0.16);
            --border-soft: rgba(148, 163, 184, 0.10);
            --text: #e6edf7;
            --dim: #8b9bb4;
            --accent: #22d3ee;
            --accent-2: #818cf8;
            --green: #34d399;
            --red: #fb7185;
            --amber: #fbbf24;
            --radius: 20px;
        }

        html {
            background: var(--bg);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                    radial-gradient(820px 420px at 12% -6%, rgba(34, 211, 238, 0.13), transparent 60%),
                    radial-gradient(900px 520px at 92% -4%, rgba(99, 102, 241, 0.16), transparent 58%),
                    radial-gradient(720px 520px at 50% 112%, rgba(52, 211, 153, 0.09), transparent 62%),
                    linear-gradient(180deg, #070b14 0%, #0a1020 55%, #070b14 100%);
            background-attachment: fixed;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 30px 20px 64px;
        }

        /* ---------- 顶部栏 ---------- */
        .topbar {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 24px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 1.3rem;
            color: #04121a;
            background: linear-gradient(135deg, #22d3ee 0%, #60a5fa 55%, #818cf8 100%);
            box-shadow: 0 10px 26px rgba(34, 211, 238, 0.28);
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 1.32rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            background: linear-gradient(90deg, #f0f9ff 0%, #a5f3fc 45%, #c7d2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            margin-top: 3px;
            color: var(--dim);
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        /* ---------- 搜索框 ---------- */
        .search {
            flex: 1 1 380px;
            max-width: 560px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 6px 6px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(8, 13, 24, 0.82);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search:focus-within {
            border-color: rgba(34, 211, 238, 0.65);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12);
        }

        .search > i {
            color: var(--dim);
            font-size: 0.9rem;
        }

        .search input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 0.92rem;
        }

        .search input::placeholder {
            color: #5b6b84;
        }

        .search button {
            flex-shrink: 0;
            padding: 10px 24px;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            color: #04121a;
            background: linear-gradient(135deg, #22d3ee, #60a5fa);
            transition: filter 0.15s, transform 0.1s;
        }

        .search button:hover {
            filter: brightness(1.12);
        }

        .search button:active {
            transform: scale(0.97);
        }

        /* ---------- 信息条 ---------- */
        .rail {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 16px;
            margin-bottom: 18px;
            padding: 11px 18px;
            border: 1px dashed var(--border);
            border-radius: 14px;
            background: rgba(148, 163, 184, 0.03);
            color: var(--dim);
            font-size: 0.84rem;
        }

        .rail b {
            color: #a5f3fc;
            font-weight: 600;
        }

        .rail .hint i {
            color: var(--accent);
            margin-right: 7px;
        }

        .rail-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .countdown {
            padding: 4px 13px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.79rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 17px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }

        .btn:hover:not(:disabled) {
            border-color: rgba(34, 211, 238, 0.5);
            color: #a5f3fc;
            background: rgba(34, 211, 238, 0.07);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .btn.mini {
            padding: 5px 13px;
            font-size: 0.78rem;
        }

        /* ---------- 服务器卡片网格 ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
            gap: 18px;
            align-items: start;
        }

        .grid > .empty {
            grid-column: 1 / -1;
        }

        .srv-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 18px 18px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: linear-gradient(160deg, rgba(148, 163, 184, 0.09) 0%, rgba(148, 163, 184, 0.03) 58%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .srv-card.enter {
            animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .srv-card.flash {
            animation: flash 1.15s ease;
        }

        @keyframes flash {
            0%, 100% {
                border-color: var(--border);
                box-shadow: none;
            }
            30%, 70% {
                border-color: rgba(34, 211, 238, 0.85);
                box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.16);
            }
        }

        .srv-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .srv-id {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .srv-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 1.05rem;
            font-weight: 700;
            color: #a5f3fc;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(99, 102, 241, 0.3));
            border: 1px solid rgba(34, 211, 238, 0.3);
            overflow: hidden;
        }

        .srv-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        .srv-names {
            min-width: 0;
        }

        .srv-names h2 {
            font-size: 1.05rem;
            font-weight: 700;
            word-break: break-all;
            line-height: 1.35;
        }

        .srv-sub {
            display: inline-block;
            margin-top: 2px;
            color: var(--dim);
            font-size: 0.72rem;
            letter-spacing: 0.07em;
        }

        .srv-state {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--dim);
            font-size: 0.76rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge i {
            font-size: 0.72rem;
            opacity: 0.85;
        }

        .badge.online {
            color: #6ee7b7;
            border-color: rgba(52, 211, 153, 0.35);
            background: rgba(52, 211, 153, 0.08);
        }

        .badge.offline {
            color: #fda4af;
            border-color: rgba(251, 113, 133, 0.35);
            background: rgba(251, 113, 133, 0.08);
        }

        .badge.unknown {
            color: #fcd34d;
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(251, 191, 36, 0.08);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .badge.online .dot {
            animation: pulse 1.8s ease-out infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
            70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        /* ---------- 卡片内容 ---------- */
        .srv-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            font-size: 0.82rem;
            color: var(--dim);
        }

        .srv-info span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .srv-info i {
            color: var(--accent);
            opacity: 0.8;
        }

        .srv-info .motd-text {
            color: #b7c5da;
            word-break: break-all;
        }

        /* 玩家详细统计 */
        .p-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .p-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            background: rgba(7, 11, 20, 0.45);
        }

        .p-top {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .p-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #eaf6ff;
            background: linear-gradient(135deg,
                hsl(var(--h, 200) 72% 44% / 0.9),
                hsl(var(--h, 200) 72% 28% / 0.95));
            border: 1px solid hsl(var(--h, 200) 72% 60% / 0.35);
        }

        .p-top strong {
            flex: 1;
            min-width: 0;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .p-ping {
            flex-shrink: 0;
            color: var(--dim);
            font-size: 0.77rem;
            font-variant-numeric: tabular-nums;
        }

        .p-ping i {
            color: var(--accent-2);
            margin-right: 4px;
            opacity: 0.85;
        }

        .p-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px 15px;
            color: #b7c5da;
            font-size: 0.79rem;
        }

        .p-meta i {
            color: var(--accent-2);
            margin-right: 6px;
            opacity: 0.9;
        }

        /* 玩家名字胶囊 (简易模式) */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(34, 211, 238, 0.22);
            background: rgba(34, 211, 238, 0.07);
            color: #a5f3fc;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .chip i {
            font-size: 0.72rem;
            opacity: 0.6;
        }

        /* 空 / 错误状态块 */
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 16px 14px;
            border: 1px dashed var(--border);
            border-radius: 12px;
            color: var(--dim);
            font-size: 0.84rem;
            text-align: center;
        }

        .empty.error {
            color: #fda4af;
            border-color: rgba(251, 113, 133, 0.35);
            background: rgba(251, 113, 133, 0.05);
        }

        /* 卡片底部 */
        .srv-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-soft);
            color: var(--dim);
            font-size: 0.78rem;
        }

        .srv-foot .ts i {
            margin-right: 6px;
            opacity: 0.7;
        }

        /* 页面页脚 */
        .page-foot {
            margin-top: 34px;
            padding-top: 18px;
            border-top: 1px solid var(--border-soft);
            color: var(--dim);
            font-size: 0.78rem;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            justify-content: space-between;
        }

        .page-foot i {
            color: var(--accent);
            margin-right: 6px;
            opacity: 0.75;
        }

        @media (max-width: 720px) {
            .page { padding: 22px 14px 48px; }
            .topbar { flex-direction: column; align-items: stretch; }
            .search { max-width: none; }
            .grid { grid-template-columns: 1fr; }
            .brand h1 { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<div class="page">
    <!-- 顶部栏: 品牌 + 搜索框 -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo"><i class="fas fa-server"></i></div>
            <div>
                <h1>服务器状态中心</h1>
                <p>Server Status Hub</p>
            </div>
        </div>
        <form class="search" id="searchForm">
            <i class="fas fa-search"></i>
            <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
                   placeholder="搜索服务器：ID（如 default）或地址（如 play.example.com:25565）">
            <button type="submit"><i class="fas fa-magnifying-glass"></i> 搜索</button>
        </form>
    </header>

    <!-- 信息条 -->
    <div class="rail">
        <span class="hint"><i class="fas fa-circle-info"></i>
            支持详细统计的服务器：<b id="knownServers">获取中…</b>
        </span>
        <div class="rail-right">
            <span class="countdown" id="countdown">30s</span>
            <button class="btn" id="refreshBtn" type="button">
                <i class="fas fa-rotate-right"></i> 立即刷新
            </button>
        </div>
    </div>

    <!-- 服务器卡片网格 -->
    <main class="grid" id="serverGrid"></main>

    <!-- 页脚 -->
    <footer class="page-foot">
        <span><i class="fas fa-database"></i>数据来源 muqingxi.com:2345</span>
        <span><i class="fas fa-clock"></i>列表内服务器展示详细统计，列表外服务器仅展示玩家名字</span>
    </footer>
</div>

<script>
    (function () {
        "use strict";

        // ================= 配置 =================
        const API_BASE = 'https://muqingxi.com:2345/proxy';
        const POLL_INTERVAL = 30;      // 轮询秒数
        const REQUEST_TIMEOUT = 15000; // 单次请求超时

        // ================= 状态 =================
        const detailed = new Map(); // serverId(原样)     -> 记录 { id, data, error, loading, updatedAt }
        const simple = new Map();   // address(小写归一) -> 记录 { address, data, error, loading, updatedAt }
        const renderedKeys = new Set(); // 已渲染过的卡片 key, 仅给首次出现播放进场动画
        let knownIds = [];          // serverlist 返回的服务器 ID 列表
        let listError = null;       // serverlist 获取失败信息
        let countdown = POLL_INTERVAL;
        let busy = false;

        // ================= DOM =================
        const els = {
            grid: document.getElementById('serverGrid'),
            searchForm: document.getElementById('searchForm'),
            searchInput: document.getElementById('searchInput'),
            knownServers: document.getElementById('knownServers'),
            countdown: document.getElementById('countdown'),
            refreshBtn: document.getElementById('refreshBtn'),
        };

        // ================= 工具函数 =================
        function escapeHtml(text) {
            return String(text ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[ch]));
        }

        function formatTime(ts) {
            if (!ts) return '—';
            const d = new Date(ts);
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;
        }

        function hueOf(str) {
            let h = 0;
            for (let i = 0; i < str.length; i += 1) h = (h * 31 + str.charCodeAt(i)) % 360;
            return h;
        }

        async function getJSON(url) {
            const res = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' },
                signal: AbortSignal.timeout(REQUEST_TIMEOUT),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // ================= 数据获取 =================
        // 1. 服务器目录: 返回 { servers: ['default'], count, type: 'server_list' }
        async function syncServerList() {
            const data = await getJSON(`${API_BASE}/serverlist`);
            const ids = Array.isArray(data && data.servers)
                ? data.servers.filter(v => typeof v === 'string' && v.trim())
                : [];
            knownIds = ids;
            listError = null;
            els.knownServers.textContent = ids.length ? ids.join(' · ') : '无';
            // 移除已从目录中消失的服务器记录
            [...detailed.keys()].forEach(k => {
                if (!ids.some(id => id.toLowerCase() === k.toLowerCase())) detailed.delete(k);
            });
        }

        // 2. 目录内服务器: 用 serverId 查详细玩家统计 (游玩时长/成就/死亡等)
        async function refreshDetailed(id) {
            let rec = detailed.get(id);
            if (!rec) {
                rec = { id, data: null, error: null, loading: true, updatedAt: 0 };
                detailed.set(id, rec);
            }
            rec.loading = true;
            render();
            try {
                const data = await getJSON(`${API_BASE}/playerstats?serverId=${encodeURIComponent(id)}`);
                if (data && data.success === false) throw new Error(data.message || '查询失败');
                rec.data = data;
                rec.error = null;
            } catch (err) {
                rec.error = (err && err.message) ? err.message : String(err);
            }
            rec.loading = false;
            rec.updatedAt = Date.now();
            render();
        }

        // 3. 目录外服务器: 用 address 查基础状态, 仅展示玩家名字
        async function refreshSimple(address) {
            const key = address.toLowerCase();
            let rec = simple.get(key);
            if (!rec) {
                rec = { address, data: null, error: null, loading: true, updatedAt: 0 };
                simple.set(key, rec);
            }
            rec.loading = true;
            render();
            try {
                const data = await getJSON(`${API_BASE}/server?address=${encodeURIComponent(address)}`);
                if (data && data.success === false) throw new Error(data.message || '查询失败');
                rec.data = data;
                rec.error = null;
            } catch (err) {
                rec.error = (err && err.message) ? err.message : String(err);
            }
            rec.loading = false;
            rec.updatedAt = Date.now();
            render();
        }

        // 刷新全部: 先同步目录, 再并行刷新全部卡片
        async function refreshAll() {
            if (busy) return;
            busy = true;
            els.refreshBtn.disabled = true;
            try {
                await syncServerList();
            } catch (err) {
                listError = (err && err.message) ? err.message : String(err);
                els.knownServers.textContent = '获取失败';
            }
            const tasks = [];
            knownIds.forEach(id => tasks.push(refreshDetailed(id)));
            [...simple.values()].forEach(rec => tasks.push(refreshSimple(rec.address)));
            await Promise.allSettled(tasks);
            render();
            busy = false;
            els.refreshBtn.disabled = false;
            countdown = POLL_INTERVAL;
            updateCountdownUI();
        }

        // ================= 渲染 =================
        function cardClass(key) {
            let cls = 'srv-card';
            if (!renderedKeys.has(key)) {
                renderedKeys.add(key);
                cls += ' enter';
            }
            return cls;
        }

        function render() {
            const cards = [];
            knownIds.forEach(id => {
                const rec = detailed.get(id);
                if (rec) cards.push(renderDetailedCard(rec));
            });
            [...simple.values()].forEach(rec => cards.push(renderSimpleCard(rec)));
            if (!cards.length) cards.push(renderGridEmpty());
            els.grid.innerHTML = cards.join('');
        }

        function renderGridEmpty() {
            if (listError) {
                return `<div class="empty error"><i class="fas fa-triangle-exclamation"></i>` +
                    `服务器列表获取失败：${escapeHtml(listError)}（可用搜索框直接搜索服务器地址）</div>`;
            }
            return `<div class="empty"><i class="fas fa-spinner fa-pulse"></i>正在获取服务器列表…</div>`;
        }

        function renderPlayerStats(players) {
            if (!players.length) {
                return `<div class="empty"><i class="fas fa-user-slash"></i>暂无玩家在线</div>`;
            }
            const cards = players.map(p => {
                const name = (p && p.name) ? String(p.name) : '未知玩家';
                const pt = (p && p.playTime && p.playTime.display) || '—';
                const adv = (p && p.advancements)
                    ? `${p.advancements.completed ?? '—'} / ${p.advancements.total ?? '—'}`
                    : '—';
                const deaths = (p && p.stats && p.stats.deaths != null) ? p.stats.deaths : '—';
                const kills = (p && p.stats && p.stats.mobKills != null) ? p.stats.mobKills : '—';
                const ping = (p && p.live && p.live.ping != null) ? p.live.ping : '—';
                const dim = String((p && p.live && p.live.dimension) || '—').replace('minecraft:', '');
                const initial = escapeHtml(name.slice(0, 1).toUpperCase());
                return `
                <article class="p-card">
                    <div class="p-top">
                        <span class="p-avatar" style="--h:${hueOf(name)}">${initial}</span>
                        <strong>${escapeHtml(name)}</strong>
                        <span class="p-ping"><i class="fas fa-wifi"></i>${escapeHtml(String(ping))} ms</span>
                    </div>
                    <div class="p-meta">
                        <span><i class="fas fa-hourglass-half"></i>${escapeHtml(String(pt))}</span>
                        <span><i class="fas fa-trophy"></i>成就 ${escapeHtml(String(adv))}</span>
                        <span><i class="fas fa-skull"></i>死亡 ${escapeHtml(String(deaths))}</span>
                        <span><i class="fas fa-crosshairs"></i>击杀 ${escapeHtml(String(kills))}</span>
                        <span><i class="fas fa-earth-asia"></i>${escapeHtml(String(dim))}</span>
                    </div>
                </article>`;
            }).join('');
            return `<div class="p-grid">${cards}</div>`;
        }

        // 目录内服务器卡片: 详细统计
        function renderDetailedCard(rec) {
            const key = `d:${rec.id}`;
            const d = rec.data || {};
            const players = Array.isArray(d.players) ? d.players : [];
            const count = typeof d.count === 'number' ? d.count : players.length;
            const max = typeof d.maxPlayers === 'number' ? d.maxPlayers : '—';

            let state;
            if (rec.loading && !rec.data) {
                state = `<span class="badge unknown"><i class="fas fa-spinner fa-pulse"></i>查询中</span>`;
            } else if (rec.error && !rec.data) {
                state = `<span class="badge offline"><span class="dot"></span>查询失败</span>`;
            } else if (d.online === true) {
                state = `<span class="badge online"><span class="dot"></span>在线</span>`;
            } else {
                state = `<span class="badge offline"><span class="dot"></span>离线</span>`;
            }

            let body;
            if (rec.loading && !rec.data) {
                body = `<div class="empty"><i class="fas fa-spinner fa-pulse"></i>正在查询玩家统计…</div>`;
            } else if (rec.error) {
                body = `<div class="empty error"><i class="fas fa-circle-exclamation"></i>${escapeHtml(rec.error)}</div>`;
            } else {
                body = renderPlayerStats(players);
            }

            return `
            <article class="${cardClass(key)}" data-key="${escapeHtml(key)}">
                <header class="srv-head">
                    <div class="srv-id">
                        <div class="srv-logo">${escapeHtml(rec.id.slice(0, 1).toUpperCase())}</div>
                        <div class="srv-names">
                            <h2>${escapeHtml(rec.id)}</h2>
                            <span class="srv-sub">详细统计 · 玩家数据</span>
                        </div>
                    </div>
                    <div class="srv-state">
                        ${state}
                        <span class="badge"><i class="fas fa-users"></i>${escapeHtml(String(count))} / ${escapeHtml(String(max))}</span>
                    </div>
                </header>
                <div class="srv-body">${body}</div>
                <footer class="srv-foot">
                    <span class="ts"><i class="fas fa-clock-rotate-left"></i>${rec.updatedAt ? '更新于 ' + formatTime(rec.updatedAt) : '尚未更新'}</span>
                    <button class="btn mini" type="button" data-refresh="${escapeHtml(key)}">
                        <i class="fas fa-rotate-right"></i>刷新
                    </button>
                </footer>
            </article>`;
        }

        // 目录外服务器卡片: 基础状态 + 仅玩家名字
        function renderSimpleCard(rec) {
            const key = `s:${rec.address.toLowerCase()}`;
            const d = rec.data || {};
            const listNames = (d.players && Array.isArray(d.players.list) && d.players.list.length)
                ? d.players.list
                : ((d.players && Array.isArray(d.players.sample))
                    ? d.players.sample.map(p => p && p.name).filter(Boolean)
                    : []);
            const onlineNum = (d.players && typeof d.players.online === 'number') ? d.players.online : listNames.length;
            const maxNum = (d.players && typeof d.players.max === 'number') ? d.players.max : '—';
            const isOnline = (d.status && d.status.code) === 'ONLINE';
            const version = (d.version && d.version.name) ? d.version.name : '—';
            const motd = (d.motd && (d.motd.clean || d.motd.raw)) || '—';
            const ping = (d.ping && typeof d.ping.latency === 'number') ? Math.round(d.ping.latency) : null;
            const favicon = (d.favicon && d.favicon.base64)
                ? (String(d.favicon.base64).startsWith('data:image')
                    ? d.favicon.base64
                    : `data:image/${String(d.favicon.format || 'png').toLowerCase()};base64,${d.favicon.base64}`)
                : null;

            let state;
            if (rec.loading && !rec.data) {
                state = `<span class="badge unknown"><i class="fas fa-spinner fa-pulse"></i>查询中</span>`;
            } else if (rec.error && !rec.data) {
                state = `<span class="badge offline"><span class="dot"></span>查询失败</span>`;
            } else if (isOnline) {
                state = `<span class="badge online"><span class="dot"></span>在线</span>`;
            } else {
                state = `<span class="badge offline"><span class="dot"></span>离线</span>`;
            }

            const pingBadge = (ping !== null)
                ? `<span class="badge"><i class="fas fa-bolt"></i>${ping} ms</span>`
                : '';

            let body;
            if (rec.loading && !rec.data) {
                body = `<div class="empty"><i class="fas fa-spinner fa-pulse"></i>正在查询…</div>`;
            } else if (rec.error) {
                body = `<div class="empty error"><i class="fas fa-circle-exclamation"></i>${escapeHtml(rec.error)}</div>`;
            } else if (listNames.length) {
                body = `<div class="chips">${listNames.map(name =>
                    `<span class="chip"><i class="fas fa-user-circle"></i>${escapeHtml(String(name))}</span>`
                ).join('')}</div>`;
            } else {
                body = `<div class="empty"><i class="fas fa-user-slash"></i>暂无玩家在线</div>`;
            }

            const logo = favicon
                ? `<img src="${favicon}" alt="favicon">`
                : escapeHtml(rec.address.slice(0, 1).toUpperCase());

            return `
            <article class="${cardClass(key)}" data-key="${escapeHtml(key)}">
                <header class="srv-head">
                    <div class="srv-id">
                        <div class="srv-logo">${logo}</div>
                        <div class="srv-names">
                            <h2>${escapeHtml(rec.address)}</h2>
                            <span class="srv-sub">简易查询 · 仅玩家名字</span>
                        </div>
                    </div>
                    <div class="srv-state">
                        ${state}
                        <span class="badge"><i class="fas fa-users"></i>${escapeHtml(String(onlineNum))} / ${escapeHtml(String(maxNum))}</span>
                        ${pingBadge}
                    </div>
                </header>
                <div class="srv-info">
                    <span><i class="fas fa-tag"></i>${escapeHtml(version)}</span>
                    <span class="motd-text"><i class="fas fa-scroll"></i>${escapeHtml(motd)}</span>
                </div>
                <div class="srv-body">${body}</div>
                <footer class="srv-foot">
                    <span class="ts"><i class="fas fa-clock-rotate-left"></i>${rec.updatedAt ? '更新于 ' + formatTime(rec.updatedAt) : '尚未更新'}</span>
                    <button class="btn mini" type="button" data-refresh="${escapeHtml(key)}">
                        <i class="fas fa-rotate-right"></i>刷新
                    </button>
                </footer>
            </article>`;
        }

        // ================= 交互 =================
        function flash(key) {
            const card = [...els.grid.querySelectorAll('[data-key]')]
                .find(el => el.dataset.key === key);
            if (!card) return;
            card.classList.remove('flash');
            void card.offsetWidth; // 重启动画
            card.classList.add('flash');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function handleSearch(rawQuery) {
            const query = String(rawQuery || '').trim();
            if (!query) return;

            // 1. 命中服务器目录中的 ID: 刷新其详细统计
            const idMatch = knownIds.find(id => id.toLowerCase() === query.toLowerCase());
            if (idMatch) {
                await refreshDetailed(idMatch);
                flash(`d:${idMatch}`);
                return;
            }

            // 2. 已存在的简易查询卡片: 直接刷新
            const key = query.toLowerCase();
            if (simple.has(key)) {
                await refreshSimple(simple.get(key).address);
                flash(`s:${key}`);
                return;
            }

            // 3. 作为服务器地址查询 (目录外, 仅展示玩家名字)
            await refreshSimple(query);
            flash(`s:${key}`);
        }

        function updateCountdownUI() {
            els.countdown.textContent = `${countdown}s`;
        }

        function tickCountdown() {
            if (busy) return;
            countdown -= 1;
            if (countdown <= 0) {
                countdown = POLL_INTERVAL;
                refreshAll().catch(() => {});
            }
            updateCountdownUI();
        }

        // ================= 事件绑定 =================
        els.searchForm.addEventListener('submit', e => {
            e.preventDefault();
            handleSearch(els.searchInput.value).catch(err => console.warn('搜索失败:', err));
        });

        els.refreshBtn.addEventListener('click', () => {
            refreshAll().catch(() => {});
        });

        els.grid.addEventListener('click', e => {
            const btn = e.target.closest('[data-refresh]');
            if (!btn || btn.disabled) return;
            const key = btn.dataset.refresh;
            btn.disabled = true;
            if (key.startsWith('d:')) {
                refreshDetailed(key.slice(2)).catch(() => {});
            } else {
                const rec = simple.get(key.slice(2));
                refreshSimple(rec ? rec.address : key.slice(2)).catch(() => {});
            }
        });

        // ================= 启动 =================
        async function init() {
            render();
            await refreshAll();
            setInterval(tickCountdown, 1000);
        }

        init().catch(err => {
            console.warn('init error:', err);
            render();
        });
    })();
</script>
</body>
</html>
