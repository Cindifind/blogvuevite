<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elysia 智能对话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        .main { display: flex; flex: 1; overflow: hidden; }
        /* 左侧模型 */
        .model-area {
            flex: 1; min-width: 0;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 70%);
            position: relative;
        }
        .model-area .live2d-container {
            width: 100%; height: 100%; max-width: 600px;
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .bubble {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,.92); color: #333; padding: 8px 20px;
            border-radius: 20px; font-size: 14px; display: none;
            max-width: 80%; text-align: center; word-break: break-word;
            box-shadow: 0 2px 12px rgba(233,69,96,.3);
            z-index: 10; pointer-events: none;
        }
        .bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(255,255,255,.92);
        }
        /* 右侧面板 */
        .panel {
            width: 380px; background: #111128;
            display: flex; flex-direction: column;
            border-left: 1px solid #e9456033;
        }
        .panel-header {
            padding: 14px 18px; font-size: 16px; font-weight: 700;
            color: #e94560; border-bottom: 1px solid #e9456022;
            display: flex; align-items: center; gap: 8px;
        }
        .panel-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
        .chat-list {
            flex: 1; overflow-y: auto; padding: 12px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: #e9456044; border-radius: 4px; }
        .msg {
            max-width: 90%; padding: 10px 14px; border-radius: 14px;
            font-size: 14px; line-height: 1.5; animation: fadeIn .3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
        .msg.user {
            align-self: flex-end; background: #e94560; color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.elysia {
            align-self: flex-start; background: #1e1e3a; color: #d0d0e0;
            border-bottom-left-radius: 4px; border: 1px solid #e9456033;
        }
        .msg.elysia .typing { display: inline-block; }
        .msg.elysia .typing span {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #e94560; margin: 0 2px;
            animation: typingBounce 1.2s infinite;
        }
        .msg.elysia .typing span:nth-child(2) { animation-delay: .15s; }
        .msg.elysia .typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes typingBounce {
            0%,60%,100% { transform: translateY(0); opacity: .4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .input-area {
            padding: 12px; border-top: 1px solid #e9456022; display: flex; gap: 8px;
        }
        .input-area input {
            flex: 1; padding: 10px 14px; border-radius: 20px;
            border: 1px solid #e9456044; background: #1a1a30; color: #e0e0e0;
            font-size: 14px; outline: none; transition: border .2s;
        }
        .input-area input:focus { border-color: #e94560; }
        .input-area button {
            padding: 10px 18px; border-radius: 20px; border: none;
            background: #e94560; color: #fff; font-size: 14px;
            cursor: pointer; font-weight: 600; transition: .2s;
            white-space: nowrap;
        }
        .input-area button:hover { background: #ff5a7a; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }
        .status {
            padding: 6px 18px; font-size: 11px; color: #666;
            border-top: 1px solid #e9456011; display: flex; gap: 12px;
        }
        .status span { color: #e94560; }
        /* 响应式 */
        @media (max-width: 700px) {
            .main { flex-direction: column; }
            .model-area { flex: none; height: 45vh; }
            .panel { width: 100%; flex: 1; }
        }
    </style>
</head>
<body>

<div class="main">
    <!-- 左侧模型 -->
    <div class="model-area" id="modelArea">
        <div class="live2d-container" id="live2d-wrapper">
            <div class="bubble" id="bubble"></div>
            <div class="live2d-config"
                 data-cubism-model="./Elysia"
                 data-model-path="./Elysia"
                 data-show-background="false"
                 data-shader-path="./Framework/Shaders/WebGL/"
                 data-container="#live2d-wrapper">
            </div>
        </div>
    </div>

    <!-- 右侧对话面板 -->
    <div class="panel">
        <div class="panel-header">
            <div class="dot" id="statusDot"></div>
            Elysia 智能对话
        </div>
        <div class="chat-list" id="chatList">
            <div class="msg elysia">
                你好！我是 Elysia，有什么想聊的吗？
            </div>
        </div>
        <div class="input-area">
            <input id="input" type="text" placeholder="输入消息..." maxlength="500"
                   onkeydown="if(event.key==='Enter')sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        <div class="status">
            动画: <span id="animStatus">等待中</span>
            | 语音: <span id="voiceStatus">-</span>
        </div>
    </div>
</div>

<script src="./Core/live2dcubismcore.js"></script>
<script src="./live2dplugin.js"></script>

<script>
    (function() {
        const bubble = document.getElementById('bubble');
        const chatList = document.getElementById('chatList');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const animStatus = document.getElementById('animStatus');
        const voiceStatus = document.getElementById('voiceStatus');

        let isProcessing = false;
        let audioCtx = null;
        let currentSource = null;

        // SDK 已内置：CubismBreath(呼吸/身体)、CubismEyeBlink(眨眼)、CubismLook(头部跟踪)、
        // CubismPhysics(头发)、MotionManager(空闲动作) — 无需手写动画循环。
        // 这里只做说话时的表情叠加。

        var isTalking = false;
        var talkRafId = 0;
        var talkSafetyTimer = 0;

        function startTalkEffects() {
            if (talkRafId) return;
            function loop(now) {
                if (!isTalking) { talkRafId = 0; return; }
                var t = now / 1000;
                var api = window.Live2DModel;
                if (api && api.addParameterDelta) {
                    // 脸颊泛红
                    api.addParameterDelta('ParamCheek', 0.4 + 0.2 * Math.sin(t * 2));
                    // 微笑眼
                    api.addParameterDelta('ParamEyeLSmile', 0.2);
                    api.addParameterDelta('ParamEyeRSmile', 0.2);
                    // 眉毛角度
                    api.addParameterDelta('ParamBrowLAngle', 0.2 * Math.abs(Math.sin(t * 3)));
                    api.addParameterDelta('ParamBrowRAngle', 0.15 * Math.abs(Math.cos(t * 3.2)));
                    // 嘴张合 — 叠加到系统 LipSync 之上
                    api.addParameterDelta('ParamMouthOpenY', 0.3 * Math.abs(Math.sin(t * 4)));
                }
                talkRafId = requestAnimationFrame(loop);
            }
            talkRafId = requestAnimationFrame(loop);

            // 安全超时：30 秒后强制停止（防止 onTalkEnd 异常不触发）
            clearTimeout(talkSafetyTimer);
            talkSafetyTimer = setTimeout(function() {
                console.warn('[Elysia] talk effects safety timeout — force stop');
                stopTalkEffects();
            }, 30000);
        }

        function stopTalkEffects() {
            isTalking = false;
            clearTimeout(talkSafetyTimer);
            if (talkRafId) { cancelAnimationFrame(talkRafId); talkRafId = 0; }
        }

        window.setElysiaTalking = function(talking) {
            isTalking = !!talking;
            if (isTalking) {
                startTalkEffects();
            } else {
                stopTalkEffects();
            }
        };

        // ===== 等待 Live2D 就绪 =====
        function waitForReady() {
            return new Promise(function(resolve) {
                if (window.Live2DModel && window.Live2DModel.startTalkFromBytes) {
                    resolve();
                    return;
                }
                if (window.Live2DModel && window.Live2DModel.onReady) {
                    window.Live2DModel.onReady(resolve);
                } else {
                    var max = 150, iv = setInterval(function() {
                        max--;
                        if (window.Live2DModel && window.Live2DModel.startTalkFromBytes) {
                            clearInterval(iv); resolve();
                        } else if (max <= 0) { clearInterval(iv); resolve(); }
                    }, 200);
                }
            });
        }

        // ===== 添加消息 =====
        function addMsg(role, text) {
            var div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chatList.appendChild(div);
            chatList.scrollTop = chatList.scrollHeight;
            return div;
        }

        function addTyping() {
            var div = document.createElement('div');
            div.className = 'msg elysia';
            div.id = 'typingMsg';
            var span = document.createElement('span');
            span.className = 'typing';
            span.innerHTML = '<span></span><span></span><span></span>';
            div.appendChild(span);
            chatList.appendChild(div);
            chatList.scrollTop = chatList.scrollHeight;
            return div;
        }

        function removeTyping() {
            var el = document.getElementById('typingMsg');
            if (el) el.remove();
        }

        // ===== 播放音频 + 驱动口型 =====
        function playAudioWithSync(rawBuffer, replyText) {
            stopAudio();

            // Web Audio 播放
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.decodeAudioData(rawBuffer.slice(0), function(audioBuffer) {
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = audioBuffer;
                currentSource.connect(audioCtx.destination);
                currentSource.start(0);
                voiceStatus.textContent = '播放中 ' + audioBuffer.duration.toFixed(1) + 's';

                var total = audioBuffer.duration;
                var track = setInterval(function() {
                    if (!currentSource || audioCtx.currentTime >= total) {
                        clearInterval(track);
                        voiceStatus.textContent = '完成';
                    }
                }, 500);
            }, function(err) {
                voiceStatus.textContent = '解码失败';
                console.error('[Audio] decode error:', err);
            });

            // Live2D 口型驱动
            if (window.Live2DModel && window.Live2DModel.startTalkFromBytes) {
                window.Live2DModel.startTalkFromBytes(rawBuffer, replyText);
                voiceStatus.textContent = '口型同步中';
            }
        }

        function stopAudio() {
            if (currentSource) {
                try { currentSource.stop(); } catch(e) {}
                currentSource = null;
            }
        }

        // ===== 发送消息 =====
        async function sendMessage() {
            if (isProcessing) return;
            var prompt = input.value.trim();
            if (!prompt) return;

            isProcessing = true;
            sendBtn.disabled = true;
            input.disabled = true;
            voiceStatus.textContent = '思考中...';

            // 显示用户消息
            addMsg('user', prompt);
            input.value = '';
            var typing = addTyping();

            // 气泡/动画由初始化时注册的 onTalkStart/onTalkEnd 驱动，这里不再重复注册

            try {
                // 1. 调用 LLM
                var llmResp = await fetch('https://muqingxi.com:2345/proxy/live2Dllm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: prompt
                });
                var llmData = await llmResp.json();
                var replyText = llmData.message || '抱歉，我无法回答这个问题。';

                // 替换打字动画为实际文本
                removeTyping();
                addMsg('elysia', replyText);

                // 显示气泡
                bubble.style.display = 'block';
                bubble.textContent = replyText;

                // 2. 调用 TTS 语音合成
                voiceStatus.textContent = '合成语音...';
                try {
                    var voiceResp = await fetch('https://muqingxi.com:2345/proxy/live2DVoice', {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                        body: replyText
                    });

                    if (voiceResp.ok) {
                        var rawBlob = await voiceResp.blob();
                        var arrayBuf = await rawBlob.arrayBuffer();
                        playAudioWithSync(arrayBuf, replyText);
                    } else {
                        voiceStatus.textContent = 'TTS 失败 HTTP ' + voiceResp.status;
                        bubble.style.display = 'none';
                    }
                } catch(ttsErr) {
                    console.error('[TTS]', ttsErr);
                    voiceStatus.textContent = 'TTS 异常';
                    bubble.style.display = 'none';
                }
            } catch(llmErr) {
                removeTyping();
                addMsg('elysia', '抱歉，连接失败了...');
                console.error('[LLM]', llmErr);
                voiceStatus.textContent = 'LLM 异常';
                bubble.style.display = 'none';
            }

            isProcessing = false;
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }

        // ===== 初始化 =====
        window.addEventListener('DOMContentLoaded', function() {
            waitForReady().then(function() {
                statusDot.style.background = '#4caf50';
                animStatus.textContent = 'SDK 运行中';

                // 注册说话回调（仅一次！SDK 用 push 累积，重复注册会导致多次触发）
                if (window.Live2DModel) {
                    window.Live2DModel.onTalkStart(function(text) {
                        console.log('[Elysia] onTalkStart:', text);
                        bubble.style.display = 'block';
                        bubble.textContent = text;
                        if (window.setElysiaTalking) window.setElysiaTalking(true);
                    });
                    window.Live2DModel.onTalkEnd(function() {
                        console.log('[Elysia] onTalkEnd');
                        bubble.style.display = 'none';
                        voiceStatus.textContent = '就绪';
                        if (window.setElysiaTalking) window.setElysiaTalking(false);
                    });
                }
            });
        });

        // 暴露给全局
        window.sendMessage = sendMessage;
    })();
</script>

</body>
</html>
